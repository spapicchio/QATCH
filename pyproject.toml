[project]
name = "qatch"
version = "1.0.36"
description = ""
authors = [{ name = "spapicchio", email = "simone.papicchio@polito.it" }]
requires-python = "~=3.9"
readme = "README.md"
license = "apache-2.0"
dependencies = [
    "pandas>=2,<3",
    "sqlalchemy>=2.0.36,<3",
    "func-timeout>=4.3.5,<5",
    "langgraph>=0.4,<0.5",
]

[dependency-groups]
test = ["pytest"]
docs = [
    "mkdocs>=1.5.3,<2",
    "mkdocs-material>=9.4.7,<10",
    "mkdocstrings-python>=1.12.2,<2",
]
dev = ["setuptools>=69.0.3,<70"]

[tool.uv]
default-groups = [
    "test",
    "docs",
    "dev",
]

[tool.hatch.build.targets.sdist]
include = ["qatch"]

[tool.hatch.build.targets.wheel]
include = ["qatch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
